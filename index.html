<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title data-i18n-title>點雲檢視器</title>
<style>
    :root {
        --bg: #1e1e28;
        --panel: #2a2a38;
        --border: #3a3a4a;
        --text: #e6e6ef;
        --accent: #4f8cff;
        --accent-hover: #6aa1ff;
        --muted: #9a9ab0;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header {
        padding: 16px 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
    }

    h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
    }

    .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-left: auto;
    }

    /* 工具列分群：群組內元件間距較小，群組之間以分隔線區隔 */
    .ctrl-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .ctrl-sep {
        width: 1px;
        align-self: stretch;
        min-height: 24px;
        background: var(--border);
        margin: 0 2px;
    }

    /* 帶標籤的下拉選單欄位（例如：色彩） */
    .ctrl-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
    }

    /* 「更多」下拉 */
    .more-wrap { position: relative; }
    .more-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #3a3a4a;
        color: var(--text);
        border: 1px solid var(--border);
    }
    .more-btn:hover { background: #4a4a5c; }
    .more-btn .more-caret {
        font-size: 11px;
        transition: transform 0.15s ease;
    }
    .more-wrap.open .more-btn {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
    }
    .more-wrap.open .more-btn .more-caret { transform: rotate(180deg); }

    .more-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 220px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        padding: 12px;
        display: none;
        flex-direction: column;
        gap: 12px;
        z-index: 1500;
    }
    .more-wrap.open .more-menu { display: flex; }

    .more-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
    }
    .more-item select { flex: 1; min-width: 0; }

    button, select, label.file-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s ease;
    }

    button:hover, label.file-btn:hover { background: var(--accent-hover); }

    select {
        background: #3a3a4a;
        color: var(--text);
        border: 1px solid var(--border);
    }

    input[type="file"] { display: none; }

    main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 16px;
        padding: 16px 24px;
    }

    .viewer {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        min-height: 500px;
        transition: border-color 0.15s ease, background 0.15s ease;
        user-select: none;
    }

    .viewer.drag-over {
        border: 2px dashed var(--accent);
        background: rgba(79, 140, 255, 0.08);
    }

    .viewer.drag-reject {
        border: 2px dashed #ff5c5c;
        background: rgba(255, 92, 92, 0.08);
    }

    .drop-hint {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        font-size: 16px;
        color: var(--accent);
        background: rgba(30, 30, 40, 0.65);
        backdrop-filter: blur(2px);
    }
    .viewer.drag-over .drop-hint,
    .viewer.drag-reject .drop-hint { display: flex; }
    .viewer.drag-reject .drop-hint { color: #ff7a7a; }

    .drop-hint .icon {
        font-size: 40px;
        line-height: 1;
    }

    .toast {
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #d9534f;
        color: #fff;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 1000;
    }
    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
    .toast.info { background: #4f8cff; }

    #canvas {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        image-rendering: pixelated;
        background: #000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        cursor: grab;
        will-change: transform;
    }
    #canvas.grabbing { cursor: grabbing; }

    /* 3D 立體檢視畫布：填滿整個 viewer，預設隱藏，切到 3D 模式時顯示 */
    .canvas3d {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 35%, #20222e 0%, #14151c 100%);
        cursor: grab;
        z-index: 7;
        touch-action: none;
        display: none;
    }
    .canvas3d.grabbing { cursor: grabbing; }

    /* 3D 模式：隱藏所有 2D 專用的元件，顯示 3D 畫布與提示 */
    .viewer.mode-3d #canvas,
    .viewer.mode-3d .overlay,
    .viewer.mode-3d .zoom-indicator,
    .viewer.mode-3d .zoom-hint,
    .viewer.mode-3d .value-indicator,
    .viewer.mode-3d .profile-panel { display: none !important; }
    .viewer.mode-3d .canvas3d { display: block; }
    .viewer.mode-3d .hint3d { display: block; }

    /* 3D 操作提示 */
    .hint3d {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.55);
        color: #d8d8e8;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 8;
        display: none;
    }
    .hint3d.show { display: block; }

    #canvas.scatter-view {
        image-rendering: auto;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        box-shadow: none;
    }

    .placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        pointer-events: none;
    }

    .zoom-indicator {
        position: absolute;
        right: 12px;
        bottom: 12px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-family: Consolas, monospace;
        pointer-events: none;
        display: none;
        z-index: 5;
    }
    .zoom-indicator.show { display: block; }

    .zoom-hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: var(--muted);
        font-size: 11px;
        pointer-events: none;
        opacity: 0.8;
        display: none;
    }
    .zoom-hint.show { display: block; }

    .side {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        overflow-y: auto;
        max-height: calc(100vh - 120px);
    }

    .side h2 {
        font-size: 14px;
        margin: 0 0 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .info-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px dashed var(--border);
        font-size: 13px;
    }

    .info-row .k { color: var(--muted); }
    .info-row .v { color: var(--text); font-family: Consolas, monospace; }

    .progress {
        width: 100%;
        height: 6px;
        background: #3a3a4a;
        border-radius: 3px;
        overflow: hidden;
        margin: 8px 0;
        display: none;
    }
    .progress.show { display: block; }
    .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.15s linear;
    }

    .colorbar {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .colorbar canvas {
        flex: 1;
        height: 14px;
        border: 1px solid var(--border);
        border-radius: 3px;
    }
    .colorbar .minmax {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
    }

    /* 可調整色階範圍 */
    .colorbar-adjust {
        margin-top: 12px;
    }
    .colorbar-track {
        position: relative;
        height: 14px;
        margin: 24px 8px 16px;
    }
    .colorbar-track canvas {
        display: block;
        width: 100%;
        height: 14px;
        border: 1px solid var(--border);
        border-radius: 3px;
    }
    .cb-handle {
        position: absolute;
        top: -4px;
        left: 0;
        width: 3px;
        height: 22px;
        background: #fff;
        border-radius: 2px;
        box-shadow: 0 0 3px rgba(0, 0, 0, .85);
        transform: translateX(-50%);
        cursor: ew-resize;
        touch-action: none;
        z-index: 2;
    }
    .cb-handle::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -7px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid var(--border);
        transform: translateX(-50%);
        box-shadow: 0 1px 3px rgba(0, 0, 0, .6);
    }
    .cb-handle:hover::after,
    .cb-handle.dragging::after {
        background: var(--accent);
    }
    .cb-handle-val {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        line-height: 1;
        color: var(--fg);
        background: #2a2a38;
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 2px 4px;
        white-space: nowrap;
        pointer-events: none;
    }
    .cb-reset {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 3px 8px;
        cursor: pointer;
    }
    .cb-reset:hover {
        color: var(--fg);
        border-color: var(--accent);
    }

    .status {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
    }

    .lang-toggle,
    .cursor-toggle {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        background: #3a3a4a;
    }
    .lang-toggle button,
    .cursor-toggle button {
        background: transparent;
        color: var(--muted);
        padding: 6px 12px;
        font-size: 12px;
        border: none;
        border-radius: 0;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-toggle button:hover,
    .cursor-toggle button:hover { color: var(--text); }
    .lang-toggle button.active,
    .cursor-toggle button.active {
        background: var(--accent);
        color: #fff;
    }

    /* 數值顯示模式的鼠標樣式 */
    #canvas.inspect-mode { cursor: default; }

    /* 鼠標位置數值顯示 */
    .value-indicator {
        position: absolute;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-family: Consolas, monospace;
        line-height: 1.4;
        white-space: nowrap;
        display: none;
        z-index: 10;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .value-indicator.show { display: block; }
    .value-indicator .k { color: var(--muted); margin-right: 4px; }

    /* 剖面 (profile) 疊加層 */
    .overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: none;
        z-index: 6;
    }
    .overlay.show { display: block; }

    /* 剖面模式的鼠標樣式 */
    #canvas.profile-mode { cursor: crosshair; }
    .viewer.profile-mode { cursor: crosshair; }

    /* 剖面圖面板 */
    .profile-panel {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        background: rgba(20, 20, 28, 0.92);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px 8px;
        z-index: 9;
        display: none;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(3px);
    }
    .profile-panel.show { display: block; }

    .profile-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
    }
    .profile-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
    }
    .profile-meta {
        font-size: 12px;
        color: var(--muted);
        font-family: Consolas, monospace;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .profile-band {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
    }
    .profile-band input {
        width: 84px;
        background: #3a3a4a;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 4px 6px;
        font-size: 12px;
        font-family: Consolas, monospace;
    }

    .profile-clear {
        background: #3a3a4a;
        color: var(--text);
        border: 1px solid var(--border);
        padding: 4px 12px;
        font-size: 12px;
        border-radius: 5px;
    }
    .profile-clear:hover { background: #4a4a5c; }

    .profile-plot {
        position: relative;
        width: 100%;
    }
    #profileCanvas {
        display: block;
        width: 100%;
        height: 160px;
    }
    .profile-tip {
        position: absolute;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-family: Consolas, monospace;
        line-height: 1.4;
        white-space: nowrap;
        display: none;
        z-index: 2;
    }
    .profile-tip.show { display: block; }
    .profile-tip .k { color: var(--muted); margin-right: 4px; }

    /* 計算機 modal */
    .calc-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        backdrop-filter: blur(2px);
    }
    .calc-overlay.show { display: flex; }

    .calc-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: min(380px, 92vw);
        max-width: 92vw;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        animation: calcPop 0.18s ease-out;
    }
    @keyframes calcPop {
        from { transform: translateY(8px); opacity: 0; }
        to   { transform: translateY(0);   opacity: 1; }
    }

    .calc-header {
        display: flex;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
    }
    .calc-header h3 { margin: 0; font-size: 15px; font-weight: 600; }
    .calc-header .calc-close {
        margin-left: auto;
        background: transparent;
        color: var(--muted);
        font-size: 20px;
        padding: 0 6px;
        line-height: 1;
        border-radius: 4px;
    }
    .calc-header .calc-close:hover { color: var(--text); background: rgba(255,255,255,0.06); }

    .calc-body { padding: 16px 18px 18px; }
    .calc-desc { font-size: 13px; color: var(--muted); margin: 0 0 14px; }

    .calc-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }

    .calc-ops {
        display: inline-flex;
        gap: 6px;
        flex-shrink: 0;
    }
    .calc-ops button {
        background: #3a3a4a;
        color: var(--text);
        width: 38px;
        height: 38px;
        font-size: 18px;
        font-weight: 600;
        padding: 0;
        border-radius: 6px;
        font-family: Consolas, monospace;
    }
    .calc-ops button:hover { background: #4a4a5c; }
    .calc-ops button.active {
        background: var(--accent);
        color: #fff;
    }

    .calc-operand {
        flex: 1 1 120px;
        min-width: 0;
        background: #1e1e28;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 10px;
        height: 38px;
        font-size: 14px;
        font-family: Consolas, monospace;
        outline: none;
    }
    .calc-operand:focus { border-color: var(--accent); }

    .calc-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    /* 「還原」靠左，其餘按鈕靠右；自動換行時也不會被截到容器外 */
    .calc-actions #calcResetBtn { margin-right: auto; }
    .calc-actions button {
        padding: 8px 14px;
        font-size: 13px;
    }
    .calc-actions .btn-secondary {
        background: #3a3a4a;
        color: var(--text);
    }
    .calc-actions .btn-secondary:hover { background: #4a4a5c; }
    .calc-actions .btn-secondary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
    }

    .calc-status {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
    }
    .calc-status.error { color: #ff7a7a; }
    .calc-status.ok    { color: #6ec27a; }

    @media (max-width: 900px) {
        main { grid-template-columns: 1fr; }
        .side { max-height: none; }
    }
</style>
</head>
<body>

<header>
    <h1>
        <span data-i18n="appTitle">點雲檢視器</span>
        <span style="color:var(--muted);font-weight:400;font-size:13px;">(.bcrf / .asc / .tif / .pcd / .bmp / .png / .jpg)</span>
    </h1>
    <div class="controls">
        <!-- 群組：檔案 -->
        <div class="ctrl-group">
            <label class="file-btn">
                <span data-i18n="btnOpen">讀取檔案</span>
                <input type="file" id="fileInput" accept=".bcrf,.asc,.tif,.tiff,.pcd,.bmp,.png,.jpg,.jpeg" />
            </label>
            <button id="btnSave" data-i18n="btnSave">儲存</button>
        </div>

        <span class="ctrl-sep" aria-hidden="true"></span>

        <!-- 群組：顯示 -->
        <div class="ctrl-group">
            <label class="ctrl-field">
                <span data-i18n="labelColormap">色彩：</span>
                <select id="colormap">
                    <option value="viridis">Viridis</option>
                    <option value="jet" selected>Jet</option>
                    <option value="hot">Hot</option>
                    <option value="gray">Gray</option>
                    <option value="inferno">Inferno</option>
                </select>
            </label>

            <div class="cursor-toggle" id="viewModeToggle">
                <button type="button" data-viewmode="2d" class="active" data-i18n="view2d" title="平面顯示">2D</button>
                <button type="button" data-viewmode="3d" data-i18n="view3d" title="3D 立體顯示">3D</button>
            </div>
        </div>

        <span class="ctrl-sep" aria-hidden="true"></span>

        <!-- 群組：工具 -->
        <div class="ctrl-group">
            <div class="cursor-toggle" id="cursorToggle">
                <button type="button" data-cursor="pan" class="active" data-i18n="cursorPan" title="拖曳模式">拖曳</button>
                <button type="button" data-cursor="inspect" data-i18n="cursorInspect" title="數值顯示模式">數值</button>
                <button type="button" data-cursor="profile" data-i18n="cursorProfile" title="剖面模式">剖面</button>
            </div>
            <div class="cursor-toggle" id="minmaxToggle">
                <button type="button" id="btnMinMax" data-i18n="btnMinMax" title="顯示 / 隱藏 Max 與 Min 數值點標記">Max/Min</button>
            </div>
        </div>

        <span class="ctrl-sep" aria-hidden="true"></span>

        <!-- 群組：更多（收納次要選項） -->
        <div class="ctrl-group more-wrap">
            <button type="button" id="btnMore" class="more-btn" aria-haspopup="true" aria-expanded="false" data-i18n-title="btnMoreTitle" title="更多選項">
                <span data-i18n="btnMore">更多</span>
                <span class="more-caret" aria-hidden="true">▾</span>
            </button>
