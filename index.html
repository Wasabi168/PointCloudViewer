const DEFAULT_LANG = 'zh-Hant';

/**
 * 判斷一個 BCP 47 語系字串是否屬於「繁體中文」。
 * 僅以下情況視為繁中：
 *   - 腳本標籤為 Hant，例如 zh-Hant、zh-Hant-TW、zh-Hant-HK
 *   - 地區為傳統繁中使用地：TW (台灣)、HK (香港)、MO (澳門)
 * 其他中文變體 (zh-CN / zh-SG / zh-Hans …) 一律視為非繁中 → 使用英文。
 */
function isTraditionalChinese(tag) {
    if (!tag) return false;
    const parts = String(tag).toLowerCase().split(/[-_]/);
    if (parts[0] !== 'zh') return false;
    for (let i = 1; i < parts.length; i++) {
        const p = parts[i];
        if (p === 'hant') return true;
        if (p === 'hans') return false;
        if (p === 'tw' || p === 'hk' || p === 'mo') return true;
        if (p === 'cn' || p === 'sg' || p === 'my') return false;
    }
    return false;
}

let currentLang = (() => {
    try {
        const saved = localStorage.getItem('pcviewer.lang');
        if (saved && I18N[saved]) return saved;
    } catch (_) {}
    // 依瀏覽器語系自動判斷：僅繁體中文 → zh-Hant，其餘 (含簡體中文) → en
    const candidates = [];
    if (Array.isArray(navigator.languages)) candidates.push(...navigator.languages);
    if (navigator.language) candidates.push(navigator.language);
    for (const tag of candidates) {
        if (isTraditionalChinese(tag)) return 'zh-Hant';
    }
    return 'en';
})();

function t(key, ...args) {
    const dict = I18N[currentLang] || I18N[DEFAULT_LANG];
    let s = (dict && dict[key] != null) ? dict[key] : (I18N[DEFAULT_LANG][key] ?? key);
    for (let i = 0; i < args.length; i++) {
        s = s.split('{' + i + '}').join(args[i]);
    }
    return s;
}

function applyLanguage(lang) {
    if (!I18N[lang]) lang = DEFAULT_LANG;
    currentLang = lang;
    try { localStorage.setItem('pcviewer.lang', lang); } catch (_) {}

    document.documentElement.lang = lang;

    // 更新所有帶 data-i18n 的節點
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
    });

    // 標題
    const titleEl = document.querySelector('title[data-i18n-title]');
    if (titleEl) titleEl.textContent = t('appTitle');

    // 通用 tooltip 翻譯（data-i18n-title="key" 會更新該節點的 title 屬性）
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        if (key) el.title = t(key);
    });

    // 語言切換按鈕的 active 狀態
    document.querySelectorAll('#langToggle button').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });

    // 鼠標模式切換按鈕的 title
    const cursorPanBtn = document.querySelector('#cursorToggle button[data-cursor="pan"]');
    const cursorInspectBtn = document.querySelector('#cursorToggle button[data-cursor="inspect"]');
    const cursorProfileBtn = document.querySelector('#cursorToggle button[data-cursor="profile"]');
    if (cursorPanBtn) cursorPanBtn.title = t('cursorPanTitle');
    if (cursorInspectBtn) cursorInspectBtn.title = t('cursorInspectTitle');
    if (cursorProfileBtn) cursorProfileBtn.title = t('cursorProfileTitle');

    // Max/Min 標記切換按鈕的 title
    const minmaxBtn = document.getElementById('btnMinMax');
    if (minmaxBtn) minmaxBtn.title = t('btnMinMaxTitle');

    // 2D / 3D 顯示切換按鈕的 title
    const view2dBtn = document.querySelector('#viewModeToggle button[data-viewmode="2d"]');
    const view3dBtn = document.querySelector('#viewModeToggle button[data-viewmode="3d"]');
    if (view2dBtn) view2dBtn.title = t('view2dTitle');
    if (view3dBtn) view3dBtn.title = t('view3dTitle');

    // 剖面面板若開啟中則重新繪製（更新語系文字）
    if (typeof profileState !== 'undefined' && profileState && profileState.data) {
        renderProfileChart();
    }

    // 計算機輸入框 placeholder
    const calcOperandInput = document.getElementById('calcOperand');
    if (calcOperandInput) calcOperandInput.placeholder = t('calcOperandPlaceholder');

    // 狀態列依情境更新：已載入則重新翻譯，否則為 idle
    if (typeof statusEl !== 'undefined' && statusEl) {
        if (typeof currentDataset !== 'undefined' && currentDataset) {
            if (currentDataset.type === 'pcd-scatter') {
                statusEl.textContent = t('statusLoadedPcd',
                    currentDataset.filename,
                    currentDataset.pointCount);
            } else {
                statusEl.textContent = t('statusLoaded',
                    currentDataset.filename,
                    currentDataset.width,
                    currentDataset.height);
            }
        } else {
            statusEl.textContent = t('statusIdle');
        }
    }
    // 儲存按鈕若非儲存中，更新文字
    if (typeof btnSave !== 'undefined' && btnSave && !btnSave.disabled) {
        btnSave.textContent = t('btnSave');
    }
    // 更新拖放提示 (依目前是否為 drag-reject 狀態)
    if (typeof dropText !== 'undefined' && dropText && typeof viewerEl !== 'undefined' && viewerEl) {
        dropText.textContent = viewerEl.classList.contains('drag-reject')
            ? t('dropReject') : t('dropSupported');
    }
}


/* =========================================================================
 *  1. 檔案解析 (對應 wr_file.py 中的 read_bcrf_file_thread / read_asc_file_thread)
 * ========================================================================= */

/** 解析 BCRF 格式：header 2048 bytes + float32 little-endian 資料 */
async function readBcrf(file, onProgress) {
    const HEADER_SIZE = 2048;

    // 讀取整個檔案
    const buffer = await file.arrayBuffer();
    const totalBytes = buffer.byteLength;

    // 解析 header
    const headerBytes = new Uint8Array(buffer, 0, HEADER_SIZE);
    const decoder = new TextDecoder('utf-8', { fatal: false });
    let headerText = decoder.decode(headerBytes);
    headerText = headerText.replace(/\x00/g, '');

    const headerDict = {};
    for (const line of headerText.split('\n')) {
        const idx = line.indexOf('=');
        if (idx >= 0) {
            const key = line.slice(0, idx).trim();
            const value = line.slice(idx + 1).trim();
            if (key) headerDict[key] = value;
        }
    }

    // 補齊預設值 + 去掉單位中的方括號
    if (!headerDict.xunit) headerDict.xunit = 'nm';
    if (!headerDict.yunit) headerDict.yunit = 'nm';
    for (const k of ['zunit', 'xunit', 'yunit']) {
        if (headerDict[k]) headerDict[k] = headerDict[k].replace(/[\[\]]/g, '');
    }

    const xPixels = parseInt(parseFloat(headerDict.xpixels));
    const yPixels = parseInt(parseFloat(headerDict.ypixels));
    if (!xPixels || !yPixels) {
        throw new Error(t('errBcrfNoHeader'));
    }

    const expectedDataSize = xPixels * yPixels * 4;
    let dataStart = HEADER_SIZE;
    let dataBytes = totalBytes - dataStart;

    // 對應 bytes_to_float 的 '%' padding 過濾行為：
    // 若實際資料長度 > 預期，取最後 N bytes；否則若開頭有 '%' padding，跳過
    if (dataBytes > expectedDataSize) {
        dataStart = totalBytes - expectedDataSize;
        dataBytes = expectedDataSize;
    } else {
        // 嘗試過濾開頭連續的 '%' (0x25) 或 NULL (0x00)
        const bytes = new Uint8Array(buffer, HEADER_SIZE);
        if (bytes.length > 0 && bytes[0] === 0x25) {
            let pos = -1;
            for (let i = 0; i < bytes.length; i++) {
                const b = bytes[i];
                if (b === 0x25 || b === 0x00) {
                    if (b === 0x00 && i > 0 && bytes[i - 1] === 0x00) break;
                    if (i >= 2 && bytes[i - 2] === 0x25 && bytes[i - 1] === 0x25 && bytes[i] === 0x00) break;
                    pos = i;
                } else {
                    break;
                }
            }
            dataStart = HEADER_SIZE + pos + 1;
            dataBytes = totalBytes - dataStart;
        }
    }

    if (onProgress) onProgress(0.3);

    // 轉成 Float32Array
    const floatCount = Math.floor(dataBytes / 4);
    let float32;
    if ((dataStart % 4) === 0) {
        float32 = new Float32Array(buffer, dataStart, floatCount);
    } else {
        // 若位址未對齊，需要 copy 一份
        const aligned = buffer.slice(dataStart, dataStart + floatCount * 4);
        float32 = new Float32Array(aligned);
    }

    if (onProgress) onProgress(0.7);

    // 若長度不足，補 0；若多餘，截斷
    const expectedCount = xPixels * yPixels;
    let data;
    if (float32.length === expectedCount) {
        data = float32;
    } else if (float32.length > expectedCount) {
        data = float32.subarray(float32.length - expectedCount);
    } else {
        data = new Float32Array(expectedCount);
        data.set(float32);
    }

    if (onProgress) onProgress(1.0);

    return { header: headerDict, data, width: xPixels, height: yPixels };
}


/** 解析 ASC 格式：# 開頭為 header，其餘為數值資料 */
async function readAsc(file, onProgress) {
    const text = await file.text();
    const lines = text.split(/\r?\n/);
    const total = lines.length;

    const headerDict = {};
    const dataLines = [];

    // 第一輪：處理 header
    for (let i = 0; i < total; i++) {
        const line = lines[i];
        if (line.includes('=') && line.includes('#')) {
            const idx = line.indexOf('=');
            const key = line.slice(0, idx).replace(/#/g, '').trim();
            const value = line.slice(idx + 1).trim();
            if (key) headerDict[key] = value;
        }
        if (onProgress && (i & 1023) === 0) onProgress((i + 1) / (2 * total));
    }

    // 第二輪：取出資料行
    for (let i = 0; i < total; i++) {
        const line = lines[i];
        if (!line.includes('#')) {
            const trimmed = line.trim();
            if (trimmed === '') continue;
            dataLines.push(trimmed.split(/\s+/));
        }
        if (onProgress && (i & 1023) === 0) onProgress(0.5 + (i + 1) / (2 * total));
    }

    // 去除單位欄位的方括號
    for (const k of ['z-unit', 'x-unit', 'y-unit']) {
        if (headerDict[k]) headerDict[k] = headerDict[k].replace(/[\[\]]/g, '');
    }

    // 決定形狀：依 x-pixels / y-pixels 或自動推算
    let width, height;
    const xp = parseInt(headerDict['x-pixels']);
    const yp = parseInt(headerDict['y-pixels']);

    let data;
    // 特殊情形：整個資料擠在一行(或兩行)裡
    if (dataLines.length === 2 && !isNaN(xp) && !isNaN(yp) &&
        dataLines[0].length === xp * yp) {
        width = xp;
        height = yp;
        data = new Float32Array(width * height);
        for (let i = 0; i < data.length; i++) data[i] = parseFloat(dataLines[0][i]);
    } else if (dataLines.length >= 1) {
        height = dataLines.length;
        width = dataLines[0].length;
        // 若 header 有明確的 xpixels/ypixels 而且能對上，則優先採用
        if (!isNaN(xp) && !isNaN(yp) && width * height === xp * yp) {
            width = xp; height = yp;
        }
        data = new Float32Array(width * height);
        let idx = 0;
        for (const row of dataLines) {
            for (const v of row) {
                data[idx++] = parseFloat(v);
                if (idx >= data.length) break;
            }
            if (idx >= data.length) break;
        }
    } else {
        throw new Error(t('errAscNoData'));
    }

    if (onProgress) onProgress(1.0);
    return { header: headerDict, data, width, height };
}


/* -------------------------------------------------------------------------
 *  PCD 解析 (對應 pcd_bin_to_csv.py)
 * ------------------------------------------------------------------------- */

const PCD_TYPE_MAP = {
    'F4': { array: Float32Array, get: (dv, o, le) => dv.getFloat32(o, le) },
    'F8': { array: Float64Array, get: (dv, o, le) => dv.getFloat64(o, le) },
    'U1': { array: Uint8Array,   get: (dv, o) => dv.getUint8(o) },
    'U2': { array: Uint16Array,  get: (dv, o, le) => dv.getUint16(o, le) },
    'U4': { array: Uint32Array,  get: (dv, o, le) => dv.getUint32(o, le) },
    'I1': { array: Int8Array,    get: (dv, o) => dv.getInt8(o) },
    'I2': { array: Int16Array,   get: (dv, o, le) => dv.getInt16(o, le) },
    'I4': { array: Int32Array,   get: (dv, o, le) => dv.getInt32(o, le) },
};

function pcdMemberSpec(type, size, count) {
    const key = type.toUpperCase() + size;
    const info = PCD_TYPE_MAP[key];
    if (!info) throw new Error(t('errPcdUnsupportedType', type, size));
    return { type: type.toUpperCase(), size, count, byteSize: size, ...info };
}

function pcdBuildRecordSpec(fields, types, sizes, counts) {
    const members = [];
    const used = {};
    let recordSize = 0;
    for (let i = 0; i < fields.length; i++) {
        const spec = pcdMemberSpec(types[i], sizes[i], counts[i]);
        let name = fields[i];
        used[name] = (used[name] || 0) + 1;
        if (used[name] > 1) name = `${fields[i]}_${used[name] - 1}`;
        members.push({ name, ...spec });
        recordSize += spec.byteSize * spec.count;
    }
    return { members, recordSize };
}

/** 解析 PCD 標頭，回傳 { header, payload } */
function pcdParseHeader(bytes) {
    const header = {
        lines: [],
        fields: [],
        size: [],
        type: [],
        count: [],
        width: 0,
        height: 1,
        points: 0,
        data: 'binary',
        headerSize: 0,
    };

    let offset = 0;
    const dec = new TextDecoder('ascii');

    while (true) {
        let nl = -1;
        for (let i = offset; i < bytes.length; i++) {
            if (bytes[i] === 0x0a) { nl = i; break; }
        }
        if (nl < 0) throw new Error(t('errPcdMalformed'));

        const line = dec.decode(bytes.subarray(offset, nl)).replace(/\r$/, '');
        offset = nl + 1;

        const stripped = line.trim();
        if (!stripped || stripped.startsWith('#')) {
            header.lines.push(line);
            continue;
        }

        header.lines.push(line);
        const tokens = stripped.split(/\s+/);
        const key = tokens[0].toUpperCase();
        const vals = tokens.slice(1);

        if (key === 'FIELDS') header.fields = vals;
        else if (key === 'SIZE') header.size = vals.map(v => parseInt(v, 10));
        else if (key === 'TYPE') header.type = vals.map(v => v.toUpperCase());
        else if (key === 'COUNT') header.count = vals.map(v => parseInt(v, 10));
        else if (key === 'WIDTH') header.width = parseInt(vals[0], 10);
        else if (key === 'HEIGHT') header.height = parseInt(vals[0], 10);
        else if (key === 'POINTS') header.points = parseInt(vals[0], 10);
        else if (key === 'DATA') {
            header.data = vals[0].toLowerCase();
            header.headerSize = offset;
            break;
        }
    }

    if (!header.count.length && header.fields.length) {
        header.count = header.fields.map(() => 1);
    }

    const nFields = header.fields.length;
    if (nFields !== header.size.length || nFields !== header.type.length ||
        nFields !== header.count.length) {
        throw new Error(t('errPcdFieldMismatch'));
    }

    return { header, payload: bytes.subarray(offset) };
}

function pcdTotalPoints(header) {
    return header.points > 0 ? header.points : header.width * header.height;
}

/** LZF 解壓 (PCL binary_compressed 使用) */
function pcdLzfDecompress(input, outLength) {
    const out = new Uint8Array(outLength);
    let inPos = 0;
    let outPos = 0;
    const inLen = input.length;

    while (inPos < inLen) {
        let ctrl = input[inPos++];
        if (ctrl < 32) {
            ctrl++;
            if (outPos + ctrl > outLength) return null;
            for (let i = 0; i < ctrl; i++) out[outPos++] = input[inPos++];
        } else {
            let len = ctrl >> 5;
            let ref = outPos - ((ctrl & 31) << 8) - 1;
            if (len === 7) len += input[inPos++];
            ref -= input[inPos++];
            len += 2;
            if (outPos + len > outLength) return null;
            for (let i = 0; i < len; i++) out[outPos++] = out[ref++];
        }
    }
    return outPos === outLength ? out : null;
}

function pcdReadMember(dv, offset, le, member, rowArrays, rowIndex) {
    const key = member.type + member.size;
    const info = PCD_TYPE_MAP[key];
    const arr = rowArrays[member.name];
    const step = member.byteSize;
    if (member.count === 1) {
        arr[rowIndex] = info.get(dv, offset, le);
        return offset + step;
    }
    const base = rowIndex * member.count;
    for (let c = 0; c < member.count; c++) {
        arr[base + c] = info.get(dv, offset + c * step, le);
    }
    return offset + step * member.count;
}

function pcdDecodeAscii(header, payload, spec, n) {
    const text = new TextDecoder('ascii').decode(payload);
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim() !== '');
    if (lines.length < n) throw new Error(t('errPcdAsciiRows', lines.length, n));

    const rowArrays = {};
    for (const m of spec.members) {
        rowArrays[m.name] = new Float64Array(m.count === 1 ? n : n * m.count);
    }

    let totalCols = 0;
    for (const m of spec.members) totalCols += m.count;

    for (let i = 0; i < n; i++) {
        const parts = lines[i].trim().split(/[\s,]+/).map(Number);
        if (parts.length < totalCols) {
            throw new Error(t('errPcdAsciiRows', i, n));
        }
        let col = 0;
        for (const m of spec.members) {
            const arr = rowArrays[m.name];
            if (m.count === 1) {
                arr[i] = parts[col++];
            } else {
                const base = i * m.count;
                for (let c = 0; c < m.count; c++) arr[base + c] = parts[col++];
            }
        }
    }
    return rowArrays;
}

function pcdDecodeBinary(header, payload, spec, n) {
    const expected = spec.recordSize * n;
    if (payload.byteLength < expected) {
        throw new Error(t('errPcdPayloadSmall', expected, payload.byteLength));
    }

    const rowArrays = {};
    for (const m of spec.members) {
        rowArrays[m.name] = new Float64Array(m.count === 1 ? n : n * m.count);
    }

    const dv = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
    const le = true;
    let offset = 0;
    for (let i = 0; i < n; i++) {
        for (const m of spec.members) {
            offset = pcdReadMember(dv, offset, le, m, rowArrays, i);
        }
    }
    return rowArrays;
}

function pcdDecodeBinaryCompressed(header, payload, spec, n) {
    if (payload.byteLength < 8) throw new Error(t('errPcdPayloadSmall', 8, payload.byteLength));

    const dv = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
    const compressedSize = dv.getUint32(0, true);
    const uncompressedSize = dv.getUint32(4, true);
    const body = payload.subarray(8, 8 + compressedSize);
    const raw = pcdLzfDecompress(body, uncompressedSize);
    if (!raw) throw new Error(t('errPcdLzf'));

    const rowArrays = {};
    for (const m of spec.members) {
        rowArrays[m.name] = new Float64Array(m.count === 1 ? n : n * m.count);
    }

    let offset = 0;
    for (const m of spec.members) {
        const key = m.type + m.size;
        const info = PCD_TYPE_MAP[key];
        const total = m.count * n;
        const nbytes = m.byteSize * total;
        const col = new info.array(raw.buffer, raw.byteOffset + offset, total);
        offset += nbytes;
        const arr = rowArrays[m.name];
        if (m.count === 1) {
            for (let i = 0; i < n; i++) arr[i] = col[i];
        } else {
            // binary_compressed：同一欄位內各分量以 column-major 存放
            for (let c = 0; c < m.count; c++) {
                const base = c * n;
                for (let i = 0; i < n; i++) arr[i * m.count + c] = col[base + i];
            }
        }
    }
    return rowArrays;
}

function pcdDecodePoints(header, payload) {
    const spec = pcdBuildRecordSpec(header.fields, header.type, header.size, header.count);
    const n = pcdTotalPoints(header);

    if (header.data === 'ascii') return pcdDecodeAscii(header, payload, spec, n);
    if (header.data === 'binary') return pcdDecodeBinary(header, payload, spec, n);
    if (header.data === 'binary_compressed') return pcdDecodeBinaryCompressed(header, payload, spec, n);
    throw new Error(t('errPcdUnsupportedData', header.data));
}

function pcdFindField(columns, names) {
    const keys = Object.keys(columns);
    for (const name of names) {
        const hit = keys.find(k => k.toLowerCase() === name);
        if (hit) return columns[hit];
    }
    return null;
}

function pcdQuantKey(v) {
    return Math.round(v * 1e6);
}

/** 是否為真正的 2D 有序點雲 (非 PCL 慣用的 WIDTH=N, HEIGHT=1 無序格式) */
function pcdIsOrganized2D(header, n) {
    const width = header.width || 0;
    const height = header.height || 1;
    return width > 1 && height > 1 && n === width * height;
}

const PCD_MAX_GRID_CELLS = 8 * 1024 * 1024;

/** 依點距估計座標量化步長 */
function pcdEstimatePrec(xCol, yCol, n) {
    const step = Math.min(n, 12000);
    const diffs = [];
    for (let i = 1; i < step; i++) {
        const dx = Math.abs(xCol[i] - xCol[i - 1]);
        const dy = Math.abs(yCol[i] - yCol[i - 1]);
        if (dx > 1e-6 && dx < 1e7) diffs.push(dx);
        if (dy > 1e-6 && dy < 1e7) diffs.push(dy);
    }
    if (!diffs.length) return 1;
    diffs.sort((a, b) => a - b);
    const idx = Math.min(diffs.length - 1, Math.floor(diffs.length * 0.2));
    return Math.max(diffs[idx], 1e-6);
}

/**
 * 依實際 x/y 座標建立壓縮索引網格：每個出現過的 (x,y) 對應一個像素，
 * 避免均勻分箱造成整欄/整列 NaN 長條。
 */
function pcdRasterizeIndexed(xCol, yCol, zCol, n) {
    let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
    for (let i = 0; i < n; i++) {
        if (xCol[i] < xmin) xmin = xCol[i];
        if (xCol[i] > xmax) xmax = xCol[i];
        if (yCol[i] < ymin) ymin = yCol[i];
        if (yCol[i] > ymax) ymax = yCol[i];
    }
    const span = Math.max(xmax - xmin, ymax - ymin, 1);
    let prec = Math.max(pcdEstimatePrec(xCol, yCol, n), span / Math.sqrt(n));

    let nx = 0;
    let ny = 0;
    for (let attempt = 0; attempt < 28; attempt++) {
        const xMap = new Map();
        const yMap = new Map();
        for (let i = 0; i < n; i++) {
            const xk = Math.round(xCol[i] / prec);
            const yk = Math.round(yCol[i] / prec);
            if (!xMap.has(xk)) xMap.set(xk, xCol[i]);
            if (!yMap.has(yk)) yMap.set(yk, yCol[i]);
        }
        nx = xMap.size;
        ny = yMap.size;
        if (nx * ny <= PCD_MAX_GRID_CELLS) {
            const xEntries = [...xMap.entries()].sort((a, b) => a[1] - b[1]);
            const yEntries = [...yMap.entries()].sort((a, b) => a[1] - b[1]);
            const xIndex = new Map(xEntries.map(([k], i) => [k, i]));
            const yIndex = new Map(yEntries.map(([k], i) => [k, i]));
            nx = xEntries.length;
            ny = yEntries.length;

            const data = new Float32Array(nx * ny);
            data.fill(NaN);
            for (let i = 0; i < n; i++) {
                const xk = Math.round(xCol[i] / prec);
                const yk = Math.round(yCol[i] / prec);
                const idx = yIndex.get(yk) * nx + xIndex.get(xk);
                const z = zCol[i];
                if (!Number.isFinite(data[idx]) || z > data[idx]) data[idx] = z;
            }
            return {
                data, width: nx, height: ny,
                viewMode: 'sparse',
                pointCount: n,
                gridPrec: prec,
            };
        }
        prec *= 1.5;
    }

    throw new Error(t('errPcdGridTooLarge', nx, ny));
}

/** 將點雲 z 值轉成 2D 高度圖 (與既有 render 管線相容) */
function pcdToHeightMap(header, columns) {
    const n = pcdTotalPoints(header);
    const zCol = pcdFindField(columns, ['z']);
    if (!zCol) throw new Error(t('errPcdNoZ'));

    const xCol = pcdFindField(columns, ['x']);
    const yCol = pcdFindField(columns, ['y']);
    const width = header.width || 0;
    const height = header.height || 1;

    // 有序 2D 點雲：依 WIDTH×HEIGHT 直接排列 z
    if (pcdIsOrganized2D(header, n)) {
        const data = new Float32Array(n);
        for (let i = 0; i < n; i++) data[i] = zCol[i];
        return {
            data, width, height,
            viewMode: 'organized',
            pointCount: n,
        };
    }

    // 嘗試由 x/y 座標還原規則網格
    if (xCol && yCol) {
        const xKeys = new Map();
        const yKeys = new Map();
        for (let i = 0; i < n; i++) {
            xKeys.set(pcdQuantKey(xCol[i]), xCol[i]);
            yKeys.set(pcdQuantKey(yCol[i]), yCol[i]);
        }
        const nx = xKeys.size;
        const ny = yKeys.size;
        if (nx * ny === n && nx > 1 && ny > 1) {
            const xs = [...xKeys.entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);
            const ys = [...yKeys.entries()].sort((a, b) => a[1] - b[1]).map(e => e[0]);
            const xi = new Map(xs.map((k, i) => [k, i]));
            const yi = new Map(ys.map((k, i) => [k, i]));
            const data = new Float32Array(n);
            data.fill(NaN);
            for (let i = 0; i < n; i++) {
                const ix = xi.get(pcdQuantKey(xCol[i]));
                const iy = yi.get(pcdQuantKey(yCol[i]));
                data[iy * nx + ix] = zCol[i];
            }
            return {
                data, width: nx, height: ny,
                viewMode: 'grid',
                pointCount: n,
            };
        }
    }

    // 無序點雲應使用散布模式（readPcd → pcdPrepareScatter），不應進入此路徑
    if (xCol && yCol) return pcdRasterizeIndexed(xCol, yCol, zCol, n);

    // 僅有 z：依點序排成近似方形
    const side = Math.max(1, Math.round(Math.sqrt(n)));
    const data = new Float32Array(side * side);
    data.fill(NaN);
    for (let i = 0; i < n; i++) {
        const x = i % side;
        const y = (i / side) | 0;
        data[y * side + x] = zCol[i];
    }
    return {
        data, width: side, height: side,
        viewMode: 'index',
        pointCount: n,
    };
}

function pcdHeaderToDict(header) {
    const dict = {
        fileformat: 'pcd',
        FIELDS: header.fields.join(' '),
        SIZE: header.size.join(' '),
        TYPE: header.type.join(' '),
        COUNT: header.count.join(' '),
        WIDTH: String(header.width),
        HEIGHT: String(header.height),
        POINTS: String(pcdTotalPoints(header)),
        DATA: header.data,
    };
    return dict;
}

function pcdCopyColumn(col, n) {
    if (col instanceof Float32Array && col.length === n) return col;
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) out[i] = col[i];
    return out;
}

/** 依資料範圍長寬比決定散布畫布像素尺寸 */
function pcdScatterCanvasSize(bounds, maxSide = 2048) {
    const spanX = bounds.xmax - bounds.xmin || 1;
    const spanY = bounds.ymax - bounds.ymin || 1;
    const aspect = spanX / spanY;
    if (aspect >= 1) {
        return {
            width: maxSide,
            height: Math.max(256, Math.round(maxSide / aspect)),
        };
    }
    return {
        width: Math.max(256, Math.round(maxSide * aspect)),
        height: maxSide,
    };
}

/** 無序 PCD → 散布資料集（保留原始 x/y/z，不網格化） */
function pcdPrepareScatter(header, columns) {
    const n = pcdTotalPoints(header);
    const xCol = pcdFindField(columns, ['x']);
    const yCol = pcdFindField(columns, ['y']);
    const zCol = pcdFindField(columns, ['z']);
    if (!zCol) throw new Error(t('errPcdNoZ'));
    if (!xCol || !yCol) throw new Error(t('errPcdNoXY'));

    const x = pcdCopyColumn(xCol, n);
    const y = pcdCopyColumn(yCol, n);
    const z = pcdCopyColumn(zCol, n);

    const bounds = { xmin: Infinity, xmax: -Infinity, ymin: Infinity, ymax: -Infinity };
    for (let i = 0; i < n; i++) {
        if (x[i] < bounds.xmin) bounds.xmin = x[i];
        if (x[i] > bounds.xmax) bounds.xmax = x[i];
        if (y[i] < bounds.ymin) bounds.ymin = y[i];
        if (y[i] > bounds.ymax) bounds.ymax = y[i];
    }

    const { width, height } = pcdScatterCanvasSize(bounds);
    const headerDict = pcdHeaderToDict(header);
    headerDict[t('infoPcdPoints')] = String(n);
    headerDict[t('infoPcdView')] = t('infoPcdScatter');

    return {
        type: 'pcd-scatter',
        x, y, z,
        pointCount: n,
        bounds,
        width,
        height,
        header: headerDict,
        pointRadius: 0,
    };
}

async function readPcd(file, onProgress) {
    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);
    if (onProgress) onProgress(0.1);

    const { header, payload } = pcdParseHeader(bytes);
    if (onProgress) onProgress(0.35);

    const columns = pcdDecodePoints(header, payload);
    if (onProgress) onProgress(0.75);

    const n = pcdTotalPoints(header);
    let result;
    if (pcdIsOrganized2D(header, n)) {
        const raster = pcdToHeightMap(header, columns);
        const headerDict = pcdHeaderToDict(header);
        headerDict[t('infoPcdPoints')] = String(raster.pointCount);
        headerDict[t('infoPcdView')] = raster.viewMode;
        result = {
            type: 'grid',
            header: headerDict,
            data: raster.data,
            width: raster.width,
            height: raster.height,
        };
    } else {
        result = pcdPrepareScatter(header, columns);
    }

    if (onProgress) onProgress(1.0);
    return result;
}


/* -------------------------------------------------------------------------
 *  PNG / JPG / BMP 解析：透過瀏覽器原生解碼，再轉為灰階 (對應 PIL .convert('L'))
 * ------------------------------------------------------------------------- */

function makeImageHeader(format, w, h, minVal) {
    return {
        fileformat: format,
        headersize: '0',
        xpixels: String(w),
        ypixels: String(h),
        xlength: String(w),
        ylength: String(h),
        scanspeed: '0',
        intelmode: '1',
        bit2nm: '1',
        xoffset: '0',
        yoffset: '0',
        voidpixels: '0',
        zmin: String(minVal),
        xunit: 'mm',
        yunit: 'mm',
        zunit: 'um',
        forcecurve: '0'
    };
}

async function decodeImageToGray(file) {
    // 優先使用 createImageBitmap (較快，能直接處理 Blob/File)
    let w, h, rgba;
    try {
        const bitmap = await createImageBitmap(file);
        w = bitmap.width; h = bitmap.height;
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        const tctx = tmp.getContext('2d');
        tctx.drawImage(bitmap, 0, 0);
        if (bitmap.close) bitmap.close();
        rgba = tctx.getImageData(0, 0, w, h).data;
    } catch (e) {
        // Fallback: 使用 <img>
        const url = URL.createObjectURL(file);
        try {
            const img = await new Promise((resolve, reject) => {
                const im = new Image();
                im.onload = () => resolve(im);
                im.onerror = () => reject(new Error(t('errImgDecodeFailed')));
                im.src = url;
            });
            w = img.naturalWidth; h = img.naturalHeight;
            const tmp = document.createElement('canvas');
            tmp.width = w; tmp.height = h;
            const tctx = tmp.getContext('2d');
            tctx.drawImage(img, 0, 0);
            rgba = tctx.getImageData(0, 0, w, h).data;
        } finally {
            URL.revokeObjectURL(url);
        }
    }

    // RGBA -> 灰階 (PIL 'L' 公式：L = R*299/1000 + G*587/1000 + B*114/1000)
    const data = new Float32Array(w * h);
    let vmin = Infinity;
    for (let i = 0; i < data.length; i++) {
        const r = rgba[i * 4];
        const g = rgba[i * 4 + 1];
        const b = rgba[i * 4 + 2];
        const v = Math.round(r * 299 / 1000 + g * 587 / 1000 + b * 114 / 1000);
        data[i] = v;
        if (v < vmin) vmin = v;
    }
    return { data, width: w, height: h, vmin };
}

async function readPng(file, onProgress) {
    if (onProgress) onProgress(0.1);
    const { data, width, height, vmin } = await decodeImageToGray(file);
    if (onProgress) onProgress(0.8);
    const header = makeImageHeader('png', width, height, vmin);
    header.original_format = 'PNG';
    if (onProgress) onProgress(1.0);
    return { header, data, width, height };
}

async function readJpg(file, onProgress) {
    if (onProgress) onProgress(0.1);
    const { data, width, height, vmin } = await decodeImageToGray(file);
    if (onProgress) onProgress(0.8);
    const header = makeImageHeader('jpg', width, height, vmin);
    header.original_format = 'JPEG';
    if (onProgress) onProgress(1.0);
    return { header, data, width, height };
}

async function readBmp(file, onProgress) {
    if (onProgress) onProgress(0.1);
    const { data, width, height, vmin } = await decodeImageToGray(file);
    if (onProgress) onProgress(0.6);

    const header = makeImageHeader('bmp', width, height, vmin);
    header.original_format = 'BMP';

    // 從 BMP 檔頭讀取 biXPelsPerMeter / biYPelsPerMeter 計算實際長度
    try {
        const buffer = await file.arrayBuffer();
        if (buffer.byteLength >= 46) {
            const view = new DataView(buffer);
            // 檢查 BMP magic: 0x42, 0x4D = 'BM'
            if (view.getUint8(0) === 0x42 && view.getUint8(1) === 0x4D) {
                const xpels = view.getUint32(38, true);
                const ypels = view.getUint32(42, true);
                if (xpels > 0 && ypels > 0) {
                    header.xlength = String(width / xpels * 1000); // m -> mm
                    header.ylength = String(height / ypels * 1000);
                }
            }
        }
    } catch (e) { /* 忽略，使用預設值 */ }

    if (onProgress) onProgress(1.0);
    return { header, data, width, height };
}


/* -------------------------------------------------------------------------
 *  TIFF 解析：支援 uncompressed 的 float32 / uint8 / uint16 / int16 單通道或 RGB
 *  對應 wr_file.py 的 read_tiff_file_thread，能讀取 tifffile 寫入的 float32 TIFF。
 * ------------------------------------------------------------------------- */

const TIFF_TYPE_SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 6: 1, 7: 1, 8: 2, 9: 4, 10: 8, 11: 4, 12: 8 };

async function readTiff(file, onProgress) {
    if (onProgress) onProgress(0.05);
    const buffer = await file.arrayBuffer();
    const view = new DataView(buffer);

    if (buffer.byteLength < 8) throw new Error(t('errTiffSmall'));

    // Byte order
    const b0 = view.getUint8(0), b1 = view.getUint8(1);
    let le;
    if (b0 === 0x49 && b1 === 0x49) le = true;          // 'II'
    else if (b0 === 0x4D && b1 === 0x4D) le = false;     // 'MM'
    else throw new Error(t('errTiffInvalid'));

    const magic = view.getUint16(2, le);
    if (magic !== 42) throw new Error(t('errTiffBigTiff', magic));

    const ifdOffset = view.getUint32(4, le);
    if (ifdOffset + 2 > buffer.byteLength) throw new Error(t('errTiffBadIfd'));

    // 解析 IFD entries
    const numEntries = view.getUint16(ifdOffset, le);
    const tags = {};
    for (let i = 0; i < numEntries; i++) {
        const entryOffset = ifdOffset + 2 + i * 12;
        const tag = view.getUint16(entryOffset, le);
        const type = view.getUint16(entryOffset + 2, le);
        const count = view.getUint32(entryOffset + 4, le);
        const typeSize = TIFF_TYPE_SIZE[type] || 0;
        const totalSize = typeSize * count;
        const valueOffset = totalSize > 4
            ? view.getUint32(entryOffset + 8, le)
            : entryOffset + 8;
        tags[tag] = { type, count, valueOffset };
    }

    const readTagValue = (info, index = 0) => {
        if (!info) return undefined;
        const { type, valueOffset } = info;
        const size = TIFF_TYPE_SIZE[type] || 0;
        const off = valueOffset + index * size;
        switch (type) {
            case 1: case 7: case 6: return view.getUint8(off);
            case 3: return view.getUint16(off, le);
            case 4: return view.getUint32(off, le);
            case 8: return view.getInt16(off, le);
            case 9: return view.getInt32(off, le);
            case 11: return view.getFloat32(off, le);
            case 12: return view.getFloat64(off, le);
            default: return view.getUint32(off, le);
        }
    };

    const readTagString = (info) => {
        if (!info) return '';
        const bytes = new Uint8Array(buffer, info.valueOffset, info.count);
        let end = bytes.length;
        while (end > 0 && bytes[end - 1] === 0) end--;
        return new TextDecoder('utf-8', { fatal: false }).decode(bytes.subarray(0, end));
    };

    // 必要標籤
    const width  = readTagValue(tags[256]);
    const height = readTagValue(tags[257]);
    if (!width || !height) throw new Error(t('errTiffMissingDim'));

    const bitsPerSample  = tags[258] ? readTagValue(tags[258]) : 1;
    const compression    = tags[259] ? readTagValue(tags[259]) : 1;
    const samplesPerPixel = tags[277] ? readTagValue(tags[277]) : 1;
    const sampleFormat    = tags[339] ? readTagValue(tags[339]) : 1;
    // 1=unsigned int, 2=signed int, 3=IEEE float

    if (compression !== 1) {
        throw new Error(t('errTiffCompressed', compression));
    }

    const stripOffsetsInfo = tags[273];
    const stripByteCountsInfo = tags[279];
    if (!stripOffsetsInfo || !stripByteCountsInfo) {
        throw new Error(t('errTiffTiled'));
    }

    if (onProgress) onProgress(0.25);

    // 讀取所有 strip 並拼成一塊連續 bytes
    const numStrips = stripOffsetsInfo.count;
    let totalStripBytes = 0;
    const offsets = [], counts = [];
    for (let i = 0; i < numStrips; i++) {
        offsets.push(readTagValue(stripOffsetsInfo, i));
        const c = readTagValue(stripByteCountsInfo, i);
        counts.push(c);
        totalStripBytes += c;
    }
    const raw = new Uint8Array(totalStripBytes);
    let pos = 0;
    for (let i = 0; i < numStrips; i++) {
        raw.set(new Uint8Array(buffer, offsets[i], counts[i]), pos);
        pos += counts[i];
        if (onProgress && (i & 7) === 0) onProgress(0.25 + 0.5 * (i + 1) / numStrips);
    }
    if (onProgress) onProgress(0.8);

    // 依 BitsPerSample / SampleFormat 解析成 Float32
    const rawView = new DataView(raw.buffer, raw.byteOffset, raw.byteLength);
    const pixelCount = width * height;
    const data = new Float32Array(pixelCount);

    const spp = samplesPerPixel;
    const bps = bitsPerSample;
    const bytesPerSample = bps / 8;

    const readSampleAt = (byteOff) => {
        if (bps === 32 && sampleFormat === 3) return rawView.getFloat32(byteOff, le);
        if (bps === 64 && sampleFormat === 3) return rawView.getFloat64(byteOff, le);
        if (bps === 32 && sampleFormat === 2) return rawView.getInt32(byteOff, le);
        if (bps === 32) return rawView.getUint32(byteOff, le);
        if (bps === 16 && sampleFormat === 2) return rawView.getInt16(byteOff, le);
        if (bps === 16) return rawView.getUint16(byteOff, le);
        if (bps === 8 && sampleFormat === 2) return rawView.getInt8(byteOff);
        if (bps === 8) return raw[byteOff];
        throw new Error(t('errTiffSampleFmt', bps, sampleFormat));
    };

    if (spp === 1) {
        for (let i = 0; i < pixelCount; i++) {
            data[i] = readSampleAt(i * bytesPerSample);
        }
    } else {
        // 多通道：對應 Python 中 data[:, :, 0] 的行為，取第一個通道
        const stride = spp * bytesPerSample;
        for (let i = 0; i < pixelCount; i++) {
            data[i] = readSampleAt(i * stride);
        }
    }

    // ImageDescription -> header dict (嘗試解析 JSON)
    let headerDict = {};
    if (tags[270]) {
        const desc = readTagString(tags[270]);
        if (desc) {
            try {
                headerDict = JSON.parse(desc);
            } catch (e) {
                headerDict = { ImageDescription: desc };
            }
        }
    }

    // 若 header 空或不足，建立預設
    if (!headerDict || Object.keys(headerDict).length <= 1) {
        headerDict = {
            fileformat: 'bcrf_unicode',
            headersize: '2048',
            xpixels: width,
            ypixels: height,
            xlength: width,
            ylength: height,
            scanspeed: '0',
            intelmode: '1',
            bit2nm: '1',
            xoffset: '',
            yoffset: '',
            voidpixels: 0,
            zmin: '0',
            xunit: 'mm',
            yunit: 'mm',
            zunit: 'um',
            forcecurve: '0'
        };
    }

    if (onProgress) onProgress(1.0);
    return { header: headerDict, data, width, height };
}


/* =========================================================================
 *  1b. 檔案輸出 (對應 wr_file.py 中的 write_*_file_thread)
 * ========================================================================= */

/** 將 header dict 的 key 由 ASC 風格轉回 BCRF 風格 */
function headerAscToBcrf(h) {
    const map = {
        'x-pixels': 'xpixels', 'y-pixels': 'ypixels',
        'x-length': 'xlength', 'y-length': 'ylength',
        'z-unit': 'zunit', 'x-unit': 'xunit', 'y-unit': 'yunit'
    };
    const out = {};
    for (const [k, v] of Object.entries(h || {})) {
        out[map[k] || k] = v;
    }
    if (out.zunit && !out.xunit && !out.yunit) {
        out.xunit = 'nm';
        out.yunit = 'nm';
    }
    delete out['File Format'];
    out.fileformat = out.fileformat || 'bcrf';
    return out;
}

/** 將 header dict 的 key 由 BCRF 風格轉為 ASC 風格 */
function headerBcrfToAsc(h) {
    const map = {
        xpixels: 'x-pixels', ypixels: 'y-pixels',
        xlength: 'x-length', ylength: 'y-length',
        zunit: 'z-unit', xunit: 'x-unit', yunit: 'y-unit'
    };
    const out = {};
    for (const [k, v] of Object.entries(h || {})) {
        out[map[k] || k] = v;
    }
    delete out.fileformat;
    out['File Format'] = 'ASCII';
    return out;
}

/** 建立一份「標準 BCRF header」，以目前資料補上遺漏的欄位 */
function buildCanonicalBcrfHeader(dataset) {
    const base = headerAscToBcrf(dataset.header);
    const defaults = {
        fileformat: 'bcrf_unicode',
        headersize: '2048',
        xpixels: dataset.width,
        ypixels: dataset.height,
        xlength: dataset.width,
        ylength: dataset.height,
        scanspeed: '0',
        intelmode: '1',
        bit2nm: '1',
        xoffset: '0',
        yoffset: '0',
        voidpixels: '0',
        zmin: '0',
        xunit: 'mm',
        yunit: 'mm',
        zunit: 'um',
        forcecurve: '0'
    };
    const out = { ...defaults, ...base };
    // 影像實際大小為最終依據
    out.xpixels = dataset.width;
    out.ypixels = dataset.height;
    return out;
}

/** 下載 Blob */
function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function stripExt(name) {
    if (!name) return 'image';
    return name.replace(/\.[^.\\/]+$/, '') || name;
}


/* ---------- BCRF ---------- */
function writeBcrf(dataset, onProgress) {
    const HEADER_SIZE = 2048;
    const h = buildCanonicalBcrfHeader(dataset);

    let headerStr = '';
    for (const [k, v] of Object.entries(h)) headerStr += `${k} = ${v}\n`;
    // 補 '%' 直到 2048 bytes (ASCII → 1 byte/char)
    if (headerStr.length < HEADER_SIZE) headerStr = headerStr.padEnd(HEADER_SIZE, '%');

    const encoder = new TextEncoder();
    const rawHeader = encoder.encode(headerStr);
    const headerBuf = new Uint8Array(HEADER_SIZE);
    headerBuf.set(rawHeader.subarray(0, HEADER_SIZE));
    if (onProgress) onProgress(0.2);

    // data 轉 float32 little-endian (Float32Array 本身就是 LE)
    // 保留 NaN / ±Inf 原始值 (IEEE 754 在 float32 中有對應的 bit pattern)
    let f32;
    if (dataset.data instanceof Float32Array) {
        f32 = dataset.data;
    } else {
        f32 = new Float32Array(dataset.data.length);
        for (let i = 0; i < dataset.data.length; i++) f32[i] = dataset.data[i];
    }
    const dataBuf = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);
    if (onProgress) onProgress(0.9);

    const blob = new Blob([headerBuf, dataBuf], { type: 'application/octet-stream' });
    if (onProgress) onProgress(1.0);
    return blob;
}


/* ---------- ASC ---------- */
function writeAsc(dataset, onProgress) {
    const { data, width, height } = dataset;
    const h = headerBcrfToAsc(buildCanonicalBcrfHeader(dataset));
    h['x-pixels'] = width;
    h['y-pixels'] = height;

    let text = '';
    for (const [k, v] of Object.entries(h)) text += `# ${k} = ${v}\n`;
    text += '\n# Start of Data:\n';

    if (onProgress) onProgress(0.1);

    const parts = [text];
    // 一次處理一列，避免單一字串過大
    for (let y = 0; y < height; y++) {
        const rowParts = new Array(width);
        for (let x = 0; x < width; x++) {
            const v = data[y * width + x];
            // 保留 NaN / Inf（對應 Python 不做 nan_to_zero，np.round(NaN)=NaN → str 為 'nan'）
            if (Number.isNaN(v)) {
                rowParts[x] = 'nan';
            } else if (v === Infinity) {
                rowParts[x] = 'inf';
            } else if (v === -Infinity) {
                rowParts[x] = '-inf';
            } else {
                // 對應 Python np.round(data, 3)
                rowParts[x] = (Math.round(v * 1000) / 1000).toString();
            }
        }
        parts.push(rowParts.join(' ') + '\n');
        if (onProgress && (y & 31) === 0) onProgress(0.1 + 0.9 * (y + 1) / height);
    }

    const blob = new Blob(parts, { type: 'text/plain;charset=utf-8' });
    if (onProgress) onProgress(1.0);
    return blob;
}


/* ---------- TIFF (float32，ImageDescription = JSON header) ---------- */
function writeTiff(dataset, onProgress) {
    const { width, height, data } = dataset;
    const h = buildCanonicalBcrfHeader(dataset);
    const descStr = JSON.stringify(h) + '\0'; // 以 NUL 結尾
    const descBytes = new TextEncoder().encode(descStr);

    if (onProgress) onProgress(0.1);

    // 保留 NaN / ±Inf 原始值 (IEEE 754 float32 bit pattern)
    let f32;
    if (data instanceof Float32Array && data.length === width * height) {
        f32 = data;
    } else {
        f32 = new Float32Array(width * height);
        for (let i = 0; i < data.length; i++) f32[i] = data[i];
    }
    const pixelBytes = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength);

    // 檔案配置
    const numEntries = 11;
    const ifdSize = 2 + numEntries * 12 + 4;
    const tiffHeaderSize = 8;
    const ifdOffset = tiffHeaderSize;
    const descOffset = ifdOffset + ifdSize;
    const rawDescEnd = descOffset + descBytes.length;
    const padAfterDesc = (4 - (rawDescEnd % 4)) % 4;
    const pixelOffset = rawDescEnd + padAfterDesc;
    const totalSize = pixelOffset + pixelBytes.length;

    const buffer = new ArrayBuffer(totalSize);
    const view = new DataView(buffer);
    const u8 = new Uint8Array(buffer);

    // TIFF header
    view.setUint16(0, 0x4949, true); // 'II'
    view.setUint16(2, 42, true);
    view.setUint32(4, ifdOffset, true);

    // IFD
    view.setUint16(ifdOffset, numEntries, true);

    let off = ifdOffset + 2;
    const entryLong = (tag, count, value) => {
        view.setUint16(off, tag, true);
        view.setUint16(off + 2, 4, true); // LONG
        view.setUint32(off + 4, count, true);
        view.setUint32(off + 8, value, true);
        off += 12;
    };
    const entryShort = (tag, count, value) => {
        view.setUint16(off, tag, true);
        view.setUint16(off + 2, 3, true); // SHORT
        view.setUint32(off + 4, count, true);
        view.setUint16(off + 8, value, true);
        view.setUint16(off + 10, 0, true);
        off += 12;
    };
    const entryAscii = (tag, count, valueOffset) => {
        view.setUint16(off, tag, true);
        view.setUint16(off + 2, 2, true); // ASCII
        view.setUint32(off + 4, count, true);
        view.setUint32(off + 8, valueOffset, true);
        off += 12;
    };

    // 標籤需依 tag 數值升序排列
    entryLong(256, 1, width);                   // ImageWidth
    entryLong(257, 1, height);                  // ImageLength
    entryShort(258, 1, 32);                     // BitsPerSample
    entryShort(259, 1, 1);                      // Compression = none
    entryShort(262, 1, 1);                      // Photometric = BlackIsZero
    entryAscii(270, descBytes.length, descOffset); // ImageDescription
    entryLong(273, 1, pixelOffset);             // StripOffsets
    entryShort(277, 1, 1);                      // SamplesPerPixel
    entryLong(278, 1, height);                  // RowsPerStrip
    entryLong(279, 1, pixelBytes.length);       // StripByteCounts
    entryShort(339, 1, 3);                      // SampleFormat = IEEE float

    view.setUint32(off, 0, true); // next IFD = 0

    u8.set(descBytes, descOffset);
    if (onProgress) onProgress(0.5);

    u8.set(pixelBytes, pixelOffset);
    if (onProgress) onProgress(1.0);

    return new Blob([buffer], { type: 'image/tiff' });
}


/* ---------- 資料 → 正規化灰階 (給 BMP / JPG 使用) ---------- */
function normalizeToGray(dataset) {
    const { data, vmin, vmax, width, height } = dataset;
    const range = (vmax > vmin) ? (vmax - vmin) : 1;
    const gray = new Uint8Array(width * height);
    for (let i = 0; i < data.length; i++) {
        let v = data[i];
        if (!Number.isFinite(v)) v = vmin;
        let t = (v - vmin) / range;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        gray[i] = (t * 255) | 0;
    }
    return gray;
}


/* ---------- BMP (24-bit 灰階) ---------- */
function writeBmp(dataset, onProgress) {
    const { width, height, header } = dataset;
    const gray = normalizeToGray(dataset);
    if (onProgress) onProgress(0.3);

    // 依 header 中的 xlength/ylength 與單位計算 biXPelsPerMeter
    const unitToMeter = (u) => {
        const key = String(u || 'mm').toLowerCase();
        const table = { m: 1, cm: 1e-2, mm: 1e-3, um: 1e-6, 'µm': 1e-6, nm: 1e-9 };
        return table[key] ?? 1e-3;
    };
    const xlength = parseFloat(header?.xlength ?? header?.['x-length'] ?? 0);
    const ylength = parseFloat(header?.ylength ?? header?.['y-length'] ?? 0);
    const xunit = header?.xunit ?? header?.['x-unit'] ?? 'mm';
    const yunit = header?.yunit ?? header?.['y-unit'] ?? 'mm';
    let xpelsPerMeter = 0, ypelsPerMeter = 0;
    if (xlength > 0) xpelsPerMeter = Math.floor(width / (xlength * unitToMeter(xunit)));
    if (ylength > 0) ypelsPerMeter = Math.floor(height / (ylength * unitToMeter(yunit)));
    if (!Number.isFinite(xpelsPerMeter) || xpelsPerMeter < 0) xpelsPerMeter = 0;
    if (!Number.isFinite(ypelsPerMeter) || ypelsPerMeter < 0) ypelsPerMeter = 0;

    // 24-bit BMP：每列 4-byte 對齊、bottom-up、BGR
    const rowSize = ((24 * width + 31) >> 5) * 4;
    const imageSize = rowSize * height;
    const fileSize = 54 + imageSize;

    const buf = new ArrayBuffer(fileSize);
    const view = new DataView(buf);
    const u8 = new Uint8Array(buf);

    // BITMAPFILEHEADER
    u8[0] = 0x42; u8[1] = 0x4D;              // 'BM'
    view.setUint32(2, fileSize, true);
    view.setUint32(6, 0, true);
    view.setUint32(10, 54, true);            // bfOffBits

    // BITMAPINFOHEADER
    view.setUint32(14, 40, true);            // biSize
    view.setInt32(18, width, true);
    view.setInt32(22, height, true);         // 正數 = bottom-up
    view.setUint16(26, 1, true);             // biPlanes
    view.setUint16(28, 24, true);            // biBitCount
    view.setUint32(30, 0, true);             // biCompression = BI_RGB
    view.setUint32(34, imageSize, true);
    view.setUint32(38, xpelsPerMeter, true);
    view.setUint32(42, ypelsPerMeter, true);
    view.setUint32(46, 0, true);
    view.setUint32(50, 0, true);

    // 像素資料 (bottom-up)
    for (let y = 0; y < height; y++) {
        const srcY = height - 1 - y;
        const dstRow = 54 + y * rowSize;
        for (let x = 0; x < width; x++) {
            const g = gray[srcY * width + x];
            const p = dstRow + x * 3;
            u8[p] = g; u8[p + 1] = g; u8[p + 2] = g; // BGR
        }
        // 末尾 padding 預設為 0
        if (onProgress && (y & 63) === 0) onProgress(0.3 + 0.7 * (y + 1) / height);
    }

    if (onProgress) onProgress(1.0);
    return new Blob([buf], { type: 'image/bmp' });
}


/* ---------- PNG (對應 write_png_file_thread：輸出目前彩色畫面) ---------- */
function writePng(dataset, onProgress) {
    const canvas = document.getElementById('canvas');
    if (onProgress) onProgress(0.5);
    return new Promise((resolve) => {
        canvas.toBlob((blob) => {
            if (onProgress) onProgress(1.0);
            resolve(blob);
        }, 'image/png');
    });
}


/* ---------- JPG (灰階正規化) ---------- */
function writeJpg(dataset, onProgress) {
    // 散布點雲沒有高度網格 (dataset.data)，無法做灰階正規化；改為擷取目前畫面，
    // 並補上不透明背景（JPG 不支援透明，否則透明區會變黑）。
    if (isPcdScatterDataset(dataset)) {
        const src = document.getElementById('canvas');
        const tmp = document.createElement('canvas');
        tmp.width = src.width;
        tmp.height = src.height;
        const ctx = tmp.getContext('2d');
        ctx.fillStyle = '#2a2a38';
        ctx.fillRect(0, 0, tmp.width, tmp.height);
        ctx.drawImage(src, 0, 0);
        if (onProgress) onProgress(0.7);
        return new Promise((resolve) => {
            tmp.toBlob((blob) => {
                if (onProgress) onProgress(1.0);
                resolve(blob);
            }, 'image/jpeg', 0.95);
        });
    }

    const { width, height } = dataset;
    const gray = normalizeToGray(dataset);
    if (onProgress) onProgress(0.3);

    const tmp = document.createElement('canvas');
    tmp.width = width;
    tmp.height = height;
    const ctx = tmp.getContext('2d');
    const img = ctx.createImageData(width, height);
    for (let i = 0; i < gray.length; i++) {
        const g = gray[i];
        const p = i * 4;
        img.data[p] = g;
        img.data[p + 1] = g;
        img.data[p + 2] = g;
        img.data[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    if (onProgress) onProgress(0.7);

    return new Promise((resolve) => {
        tmp.toBlob((blob) => {
            if (onProgress) onProgress(1.0);
            resolve(blob);
        }, 'image/jpeg', 0.95);
    });
}


/** 統一的存檔派送：依格式呼叫對應 writer，產生 Blob 後觸發下載 */
/** 依格式產生對應的檔案 Blob（不下載） */
async function buildSaveBlob(dataset, format, onProgress) {
    switch (format) {
        case 'bcrf': return writeBcrf(dataset, onProgress);
        case 'asc':  return writeAsc(dataset, onProgress);
        case 'tiff': return writeTiff(dataset, onProgress);
        case 'bmp':  return writeBmp(dataset, onProgress);
        case 'png':  return await writePng(dataset, onProgress);
        case 'jpg':  return await writeJpg(dataset, onProgress);
        default:     throw new Error(t('errSaveFmt', format));
    }
}

/** 格式 → 副檔名 */
function formatToExt(format) {
    return (format === 'tiff') ? 'tif' : format;
}

/** 各儲存格式的中繼資料（MIME 與接受的副檔名），供原生「另存新檔」視窗使用 */
const SAVE_FORMAT_META = {
    bcrf: { mime: 'application/octet-stream', exts: ['.bcrf'], descKey: 'saveFormat.bcrf' },
    asc:  { mime: 'text/plain',               exts: ['.asc'],  descKey: 'saveFormat.asc'  },
    tiff: { mime: 'image/tiff',               exts: ['.tif', '.tiff'], descKey: 'saveFormat.tiff' },
    bmp:  { mime: 'image/bmp',                exts: ['.bmp'],  descKey: 'saveFormat.bmp'  },
    png:  { mime: 'image/png',                exts: ['.png'],  descKey: 'saveFormat.png'  },
    jpg:  { mime: 'image/jpeg',               exts: ['.jpg', '.jpeg'], descKey: 'saveFormat.jpg' },
};

/** 副檔名（不含點，小寫）→ 內部格式代碼 */
function extToFormat(ext) {
    switch ((ext || '').toLowerCase()) {
        case 'bcrf': return 'bcrf';
        case 'asc':  return 'asc';
        case 'tif':
        case 'tiff': return 'tiff';
        case 'bmp':  return 'bmp';
        case 'png':  return 'png';
        case 'jpg':
        case 'jpeg': return 'jpg';
        default:     return null;
    }
}

/** 此資料集允許儲存的格式（散布點雲僅支援 png / jpg） */
function getAllowedSaveFormats(dataset) {
    if (dataset && dataset.type === 'pcd-scatter') return ['png', 'jpg'];
    return ['bcrf', 'asc', 'tiff', 'bmp', 'png', 'jpg'];
}

/** 建立 showSaveFilePicker 的 types 清單，preferred 格式排在最前面（成為視窗預設選項） */
function buildPickerTypes(formats, preferred) {
    const ordered = formats.slice();
    if (preferred && ordered.includes(preferred)) {
        ordered.splice(ordered.indexOf(preferred), 1);
        ordered.unshift(preferred);
    }
    return ordered.map(fmt => {
        const meta = SAVE_FORMAT_META[fmt];
        return { description: t(meta.descKey), accept: { [meta.mime]: meta.exts } };
    });
}

async function saveAs(dataset, format, onProgress) {
    const blob = await buildSaveBlob(dataset, format, onProgress);
    const base = stripExt(dataset.filename);
    triggerDownload(blob, `${base}.${formatToExt(format)}`);
}


/* =========================================================================
 *  2. 彩色映射 (Colormap)
 * ========================================================================= */

// 常用 colormap (簡化版)：每個色階是 [r, g, b] (0~1)
const COLORMAPS = {
    viridis: [
        [0.267, 0.005, 0.329], [0.283, 0.141, 0.458], [0.254, 0.265, 0.530],
        [0.207, 0.372, 0.553], [0.164, 0.471, 0.558], [0.128, 0.567, 0.551],
        [0.135, 0.659, 0.518], [0.267, 0.749, 0.441], [0.478, 0.821, 0.318],
        [0.741, 0.873, 0.150], [0.993, 0.906, 0.144]
    ],
    jet: [
        [0, 0, 0.5], [0, 0, 1], [0, 0.5, 1], [0, 1, 1],
        [0.5, 1, 0.5], [1, 1, 0], [1, 0.5, 0], [1, 0, 0], [0.5, 0, 0]
    ],
    hot: [
        [0, 0, 0], [0.3, 0, 0], [0.6, 0, 0], [1, 0, 0],
        [1, 0.3, 0], [1, 0.6, 0], [1, 1, 0], [1, 1, 0.5], [1, 1, 1]
    ],
    gray: [[0, 0, 0], [1, 1, 1]],
    inferno: [
        [0.001, 0.000, 0.014], [0.112, 0.065, 0.302], [0.317, 0.072, 0.405],
        [0.510, 0.121, 0.408], [0.705, 0.182, 0.350], [0.866, 0.290, 0.217],
        [0.964, 0.493, 0.076], [0.993, 0.720, 0.128], [0.961, 0.936, 0.488],
        [0.988, 0.998, 0.645]
    ]
};

/**
 * 依 t (0~1) 在 stops 中線性內插得到 [r, g, b]
 */
function sampleColormap(cmapName, t) {
    const stops = COLORMAPS[cmapName] || COLORMAPS.viridis;
    if (t <= 0) return stops[0];
    if (t >= 1) return stops[stops.length - 1];
    const scaled = t * (stops.length - 1);
    const i = Math.floor(scaled);
    const f = scaled - i;
    const a = stops[i], b = stops[i + 1];
    return [
        a[0] + (b[0] - a[0]) * f,
        a[1] + (b[1] - a[1]) * f,
        a[2] + (b[2] - a[2]) * f
    ];
}

/** 建立 256 階 RGB 查表 (0~255) */
function buildColormapLut(cmapName) {
    const lut = new Uint8ClampedArray(256 * 3);
    for (let i = 0; i < 256; i++) {
        const [r, g, b] = sampleColormap(cmapName, i / 255);
        lut[i * 3]     = Math.round(r * 255);
        lut[i * 3 + 1] = Math.round(g * 255);
        lut[i * 3 + 2] = Math.round(b * 255);
    }
    return lut;
}

/** 世界座標 → 畫布像素（Y 軸向上，畫布 Y 向下） */
function pcdWorldToCanvasPx(dataset, wx, wy) {
    const { bounds, width, height } = dataset;
    const spanX = bounds.xmax - bounds.xmin || 1;
    const spanY = bounds.ymax - bounds.ymin || 1;
    return {
        px: ((wx - bounds.xmin) / spanX) * (width - 1),
        py: ((bounds.ymax - wy) / spanY) * (height - 1),
    };
}

/** 在 ImageData 上畫單像素點 */
function stampPixel(px, width, height, ix, iy, r, g, b) {
    if (ix < 0 || iy < 0 || ix >= width || iy >= height) return;
    const po = (iy * width + ix) * 4;
    px[po] = r;
    px[po + 1] = g;
    px[po + 2] = b;
    px[po + 3] = 255;
}

/** 在 ImageData 上戳印實心圓點 */
function stampDisk(px, width, height, cx, cy, radius, r, g, b) {
    if (radius <= 0) {
        stampPixel(px, width, height, Math.round(cx), Math.round(cy), r, g, b);
        return;
    }
    const r2 = radius * radius;
    const x0 = Math.max(0, Math.ceil(cx - radius));
    const x1 = Math.min(width - 1, Math.floor(cx + radius));
    const y0 = Math.max(0, Math.ceil(cy - radius));
    const y1 = Math.min(height - 1, Math.floor(cy + radius));
    for (let y = y0; y <= y1; y++) {
        const dy = y - cy;
        for (let x = x0; x <= x1; x++) {
            const dx = x - cx;
            if (dx * dx + dy * dy > r2) continue;
            const po = (y * width + x) * 4;
            px[po] = r;
            px[po + 1] = g;
            px[po + 2] = b;
            px[po + 3] = 255;
        }
    }
}

/** 散布繪製：世界座標 → 螢幕座標，點大小固定為螢幕像素 */
function renderPcdScatter(dataset, cmap) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const { x, y, z, vmin, vmax } = dataset;
    const n = z.length;
    const R = SCATTER_POINT_SCREEN_RADIUS;

    const { w: sw, h: sh } = getScatterViewerSize();
    scatterView.screenW = sw;
    scatterView.screenH = sh;

    // putImageData 不受 ctx 變換影響，緩衝區須用實際 device 像素（含 HiDPI）
    const dpr = window.devicePixelRatio || 1;
    const bw = Math.max(1, Math.round(sw * dpr));
    const bh = Math.max(1, Math.round(sh * dpr));
    canvas.width = bw;
    canvas.height = bh;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const img = ctx.createImageData(bw, bh);
    const px = img.data;
    const lut = buildColormapLut(cmap);
    const { cmin, crange } = effectiveColorRange(dataset);
    const rBuf = R > 0 ? R * dpr : 0;

    const screenX = new Int16Array(n);
    const screenY = new Int16Array(n);

    for (let i = 0; i < n; i++) {
        const { sx, sy } = scatterWorldToScreen(x[i], y[i]);
        const ix = Math.round(sx);
        const iy = Math.round(sy);
        screenX[i] = ix;
        screenY[i] = iy;

        if (ix < -R || iy < -R || ix > sw + R || iy > sh + R) continue;

        const bx = Math.round(sx * dpr);
        const by = Math.round(sy * dpr);

        let t = (z[i] - cmin) / crange;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const li = (t * 255) | 0;
        const lo = li * 3;
        const cr = lut[lo], cg = lut[lo + 1], cb = lut[lo + 2];
        if (R <= 0) stampPixel(px, bw, bh, bx, by, cr, cg, cb);
        else stampDisk(px, bw, bh, sx * dpr, sy * dpr, rBuf, cr, cg, cb);
    }

    ctx.putImageData(img, 0, 0);

    const pickCell = 24;
    const buckets = new Map();
    for (let i = 0; i < n; i++) {
        const bx = (screenX[i] / pickCell) | 0;
        const by = (screenY[i] / pickCell) | 0;
        const key = bx + ',' + by;
        let list = buckets.get(key);
        if (!list) { list = []; buckets.set(key, list); }
        list.push(i);
    }
    dataset._pick = { buckets, screenX, screenY, pickCell, pickRadius: Math.max(6, R + 4) };
}

/** 散布模式：找游標附近最近的點 */
function findNearestPcdPoint(dataset, canvasPx, canvasPy) {
    const pick = dataset._pick;
    if (!pick) return null;

    const { buckets, screenX, screenY, pickCell, pickRadius } = pick;
    const bx = (canvasPx / pickCell) | 0;
    const by = (canvasPy / pickCell) | 0;
    const r2max = pickRadius * pickRadius;
    let best = null;
    let bestD2 = r2max;

    for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
            const list = buckets.get((bx + dx) + ',' + (by + dy));
            if (!list) continue;
            for (let k = 0; k < list.length; k++) {
                const i = list[k];
                const ddx = screenX[i] - canvasPx;
                const ddy = screenY[i] - canvasPy;
                const d2 = ddx * ddx + ddy * ddy;
                if (d2 < bestD2) {
                    bestD2 = d2;
                    best = i;
                }
            }
        }
    }
    return best;
}


/* =========================================================================
 *  3. 繪製
 * ========================================================================= */

let currentDataset = null;   // { data, width, height, vmin, vmax, header }

/* 色階顯示範圍：以資料 [vmin, vmax] 的比例表示（0~1）。
 * 拖曳 colorbar 上的兩個標籤即可調整哪段數值對應整條色帶。*/
const colorClip = { lo: 0, hi: 1 };

/** 依目前 colorClip 換算實際的色階上下界與區間 */
function effectiveColorRange(dataset) {
    const span = (dataset.vmax - dataset.vmin) || 1;
    const cmin = dataset.vmin + colorClip.lo * span;
    const cmax = dataset.vmin + colorClip.hi * span;
    return { cmin, cmax, crange: (cmax > cmin) ? (cmax - cmin) : 1e-12 };
}

function computeRange(data) {
    let vmin = Infinity, vmax = -Infinity;
    for (let i = 0; i < data.length; i++) {
        const v = data[i];
        if (!Number.isFinite(v)) continue;
        if (v < vmin) vmin = v;
        if (v > vmax) vmax = v;
    }
    if (!Number.isFinite(vmin) || !Number.isFinite(vmax)) { vmin = 0; vmax = 1; }
    if (vmin === vmax) { vmax = vmin + 1; }
    return { vmin, vmax };
}

/* 畫面狀態：scale = CSS 顯示像素 / 影像像素；tx/ty 為左上角的位移(CSS px) */
const view = { scale: 1, tx: 0, ty: 0, minScale: 0.02, maxScale: 100 };

/** 散布點雲視埠：縮放只改變可見世界範圍，點在螢幕上維持固定像素大小 */
const scatterView = {
    centerX: 0,
    centerY: 0,
    worldPerPx: 1,
    baseWorldPerPx: 1,
    screenW: 1,
    screenH: 1,
    minWorldPerPx: 1e-6,
    maxWorldPerPx: 1e9,
};
const SCATTER_POINT_SCREEN_RADIUS = 1;
let scatterRedrawQueued = false;

function isPcdScatterDataset(ds) {
    return ds && ds.type === 'pcd-scatter';
}

function getScatterViewerSize() {
    const viewer = document.getElementById('viewer');
    return {
        w: Math.max(1, viewer.clientWidth),
        h: Math.max(1, viewer.clientHeight),
    };
}

function fitScatterToViewer(dataset) {
    const { w, h } = getScatterViewerSize();
    const pad = 24;
    const b = dataset.bounds;
    const spanX = (b.xmax - b.xmin) || 1;
    const spanY = (b.ymax - b.ymin) || 1;
    const wpp = Math.max(spanX / Math.max(1, w - pad * 2), spanY / Math.max(1, h - pad * 2));

    scatterView.screenW = w;
    scatterView.screenH = h;
    scatterView.centerX = (b.xmin + b.xmax) * 0.5;
    scatterView.centerY = (b.ymin + b.ymax) * 0.5;
    scatterView.worldPerPx = wpp;
    scatterView.baseWorldPerPx = wpp;
    scatterView.minWorldPerPx = wpp / 100;
    scatterView.maxWorldPerPx = wpp * 100;
}

function scatterWorldToScreen(wx, wy) {
    const halfW = scatterView.screenW * 0.5;
    const halfH = scatterView.screenH * 0.5;
    return {
        sx: (wx - scatterView.centerX) / scatterView.worldPerPx + halfW,
        sy: (scatterView.centerY - wy) / scatterView.worldPerPx + halfH,
    };
}

/** 螢幕(viewer CSS) 座標 → 世界座標（scatterWorldToScreen 的逆運算） */
function scatterScreenToWorld(sx, sy) {
    const halfW = scatterView.screenW * 0.5;
    const halfH = scatterView.screenH * 0.5;
    return {
        wx: scatterView.centerX + (sx - halfW) * scatterView.worldPerPx,
        wy: scatterView.centerY - (sy - halfH) * scatterView.worldPerPx,
    };
}

function scatterZoomAt(screenX, screenY, zoomFactor) {
    const worldX = scatterView.centerX + (screenX - scatterView.screenW * 0.5) * scatterView.worldPerPx;
    const worldY = scatterView.centerY - (screenY - scatterView.screenH * 0.5) * scatterView.worldPerPx;

    let wpp = scatterView.worldPerPx / zoomFactor;
    if (wpp < scatterView.minWorldPerPx) wpp = scatterView.minWorldPerPx;
    if (wpp > scatterView.maxWorldPerPx) wpp = scatterView.maxWorldPerPx;

    scatterView.worldPerPx = wpp;
    scatterView.centerX = worldX - (screenX - scatterView.screenW * 0.5) * wpp;
    scatterView.centerY = worldY + (screenY - scatterView.screenH * 0.5) * wpp;
}

function scatterPanBy(dScreenX, dScreenY) {
    scatterView.centerX -= dScreenX * scatterView.worldPerPx;
    scatterView.centerY += dScreenY * scatterView.worldPerPx;
}

function requestScatterRedraw() {
    if (!isPcdScatterDataset(currentDataset)) return;
    if (scatterRedrawQueued) return;
    scatterRedrawQueued = true;
    requestAnimationFrame(() => {
        scatterRedrawQueued = false;
        if (!isPcdScatterDataset(currentDataset)) return;
        renderPcdScatter(currentDataset, cmapSelect.value);
        applyTransform();
    });
}

function applyTransform() {
    const canvas = document.getElementById('canvas');
    const ind = document.getElementById('zoomIndicator');

    if (isPcdScatterDataset(currentDataset)) {
        canvas.style.transform = 'none';
        const pct = (scatterView.baseWorldPerPx / scatterView.worldPerPx) * 100;
        ind.textContent = (pct >= 100 ? pct.toFixed(0) : pct.toFixed(1)) + '%';
        drawProfileOverlay();
        return;
    }

    canvas.style.transform = `translate(${view.tx}px, ${view.ty}px) scale(${view.scale})`;
    ind.textContent = (view.scale * 100).toFixed(view.scale >= 1 ? 0 : 1) + '%';
    drawProfileOverlay();
}

function fitImageToViewer() {
    if (!currentDataset) return;
    if (isPcdScatterDataset(currentDataset)) {
        fitScatterToViewer(currentDataset);
        renderPcdScatter(currentDataset, cmapSelect.value);
        applyTransform();
        return;
    }
    const viewer = document.getElementById('viewer');
    const vw = viewer.clientWidth;
    const vh = viewer.clientHeight;
    const w = currentDataset.width;
    const h = currentDataset.height;
    const padding = 24;
    const s = Math.min((vw - padding * 2) / w, (vh - padding * 2) / h, 8);
    view.scale = s > 0 ? s : 1;
    view.tx = (vw - w * view.scale) / 2;
    view.ty = (vh - h * view.scale) / 2;
    applyTransform();
}

/* 只重繪像素，不改變顯示 transform */
function renderPixels(dataset, cmap) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const { data, width, height, vmin, vmax } = dataset;

    canvas.width = width;
    canvas.height = height;

    const img = ctx.createImageData(width, height);
    const { cmin, crange } = effectiveColorRange(dataset);

    const lut = buildColormapLut(cmap);
    const px = img.data;
    for (let i = 0; i < data.length; i++) {
        const po = i * 4;
        const v = data[i];
        if (!Number.isFinite(v)) {
            px[po] = px[po + 1] = px[po + 2] = 0;
            px[po + 3] = 255;
            continue;
        }
        let t = (v - cmin) / crange;
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const idx = (t * 255) | 0;
        const lo = idx * 3;
        px[po]     = lut[lo];
        px[po + 1] = lut[lo + 1];
        px[po + 2] = lut[lo + 2];
        px[po + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
}

/**
 * 完整渲染：畫像素、(視需要)重設縮放與平移、同步色階資訊
 * @param {boolean} resetView 是否重新 fit 到檢視區（載入新檔 / 視窗改變時為 true）
 */
function render(dataset, cmap, resetView = false) {
    const canvas = document.getElementById('canvas');
    if (dataset.type === 'pcd-scatter') {
        canvas.classList.add('scatter-view');
        renderPcdScatter(dataset, cmap);
    } else {
        canvas.classList.remove('scatter-view');
        // 清除散布模式遺留的行內尺寸，讓影像 canvas 依點陣大小 + transform 縮放顯示
        canvas.style.width = '';
        canvas.style.height = '';
        renderPixels(dataset, cmap);
    }

    canvas.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('zoomIndicator').classList.add('show');
    document.getElementById('zoomHint').classList.add('show');

    if (resetView) fitImageToViewer();
    else applyTransform();

    renderColorbar(cmap);
    document.getElementById('zMin').textContent = dataset.vmin.toFixed(4);
    document.getElementById('zMax').textContent = dataset.vmax.toFixed(4);
    syncColorbarHandles();
}

function renderColorbar(cmap) {
    const cb = document.getElementById('colorbarCanvas');
    const ctx = cb.getContext('2d');
    const w = cb.width, h = cb.height;
    const img = ctx.createImageData(w, h);
    // 色帶橫軸代表完整資料範圍；漸層只壓縮在 [lo, hi] 之間，
    // 兩游標越靠近，整條色彩被擠進越小的數值區間 = 對比越高。
    const lo = colorClip.lo, hi = colorClip.hi;
    const span = (hi > lo) ? (hi - lo) : 1e-12;
    for (let x = 0; x < w; x++) {
        const f = x / (w - 1);              // 0~1 對應 vmin~vmax
        let t = (f - lo) / span;            // 映射到色彩漸層位置
        if (t < 0) t = 0; else if (t > 1) t = 1;
        const [r, g, b] = sampleColormap(cmap, t);
        for (let y = 0; y < h; y++) {
            const p = (y * w + x) * 4;
            img.data[p]     = Math.round(r * 255);
            img.data[p + 1] = Math.round(g * 255);
            img.data[p + 2] = Math.round(b * 255);
            img.data[p + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
}

/** 依 colorClip 更新兩個標籤的位置與數值文字 */
function syncColorbarHandles() {
    const hLo = document.getElementById('cbHandleLo');
    const hHi = document.getElementById('cbHandleHi');
    const valLo = document.getElementById('cbValLo');
    const valHi = document.getElementById('cbValHi');
    if (!hLo || !hHi) return;

    hLo.style.left = (colorClip.lo * 100) + '%';
    hHi.style.left = (colorClip.hi * 100) + '%';

    if (currentDataset) {
        const span = currentDataset.vmax - currentDataset.vmin;
        const lo = currentDataset.vmin + colorClip.lo * span;
        const hi = currentDataset.vmin + colorClip.hi * span;
        valLo.textContent = lo.toFixed(3);
        valHi.textContent = hi.toFixed(3);
    } else {
        valLo.textContent = '';
        valHi.textContent = '';
    }
}

/** 重設色階顯示範圍為完整資料範圍 */
function resetColorClip(rerender = true) {
    colorClip.lo = 0;
    colorClip.hi = 1;
    if (rerender && currentDataset) {
        render(currentDataset, cmapSelect.value, false);
        if (typeof Viewer3D !== 'undefined' && Viewer3D.isActive()) Viewer3D.refreshColors();
    } else {
        syncColorbarHandles();
    }
}

/** 綁定 colorbar 兩個標籤的拖曳行為 */
function setupColorbarHandles() {
    const track = document.getElementById('colorbarTrack');
    const hLo = document.getElementById('cbHandleLo');
    const hHi = document.getElementById('cbHandleHi');
    const resetBtn = document.getElementById('cbReset');
    if (!track || !hLo || !hHi) return;

    const MIN_GAP = 0.01;
    let dragging = null;
    let rafPending = false;

    function fracFromClientX(clientX) {
        const r = track.getBoundingClientRect();
        if (r.width <= 0) return 0;
        let f = (clientX - r.left) / r.width;
        return Math.min(1, Math.max(0, f));
    }

    function scheduleRender() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => {
            rafPending = false;
            if (currentDataset) render(currentDataset, cmapSelect.value, false);
            else syncColorbarHandles();
            if (typeof Viewer3D !== 'undefined' && Viewer3D.isActive()) Viewer3D.refreshColors();
        });
    }

    function onMove(e) {
        if (!dragging) return;
        const f = fracFromClientX(e.clientX);
        if (dragging === 'lo') {
            colorClip.lo = Math.min(f, colorClip.hi - MIN_GAP);
            if (colorClip.lo < 0) colorClip.lo = 0;
        } else {
            colorClip.hi = Math.max(f, colorClip.lo + MIN_GAP);
            if (colorClip.hi > 1) colorClip.hi = 1;
        }
        scheduleRender();
    }

    function endDrag() {
        if (!dragging) return;
        (dragging === 'lo' ? hLo : hHi).classList.remove('dragging');
        dragging = null;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', endDrag);
    }

    function startDrag(which, handle, e) {
        dragging = which;
        handle.classList.add('dragging');
        e.preventDefault();
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', endDrag);
    }

    hLo.addEventListener('pointerdown', (e) => startDrag('lo', hLo, e));
    hHi.addEventListener('pointerdown', (e) => startDrag('hi', hHi, e));

    if (resetBtn) resetBtn.addEventListener('click', () => resetColorClip(true));

    syncColorbarHandles();
}

function renderInfo(header, width, height, extra) {
    const list = document.getElementById('infoList');
    list.innerHTML = '';

    const addRow = (k, v) => {
        const row = document.createElement('div');
        row.className = 'info-row';
        row.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span>`;
        list.appendChild(row);
    };

    if (extra && extra.pointCount != null) {
        addRow(t('infoPcdPoints'), String(extra.pointCount));
        addRow(t('infoSize'), `${width} × ${height} (${t('infoPcdScatter')})`);
    } else {
        addRow(t('infoSize'), `${width} × ${height}`);
    }
    for (const [k, v] of Object.entries(header)) {
        if (v === '' || v == null) continue;
        addRow(k, String(v).length > 30 ? String(v).slice(0, 30) + '…' : v);
    }
}

 *  4. UI 綁定
